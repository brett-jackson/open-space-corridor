<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Space</title>
  <meta name="description" content="Colorado open spaces.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="back" href="index.html">&larr; All open spaces</a>
      <h1 class="space-name" id="space-title">Open Space</h1>
      <p class="space-subtitle" id="space-subtitle"></p>
      <nav class="section-nav" id="section-nav" aria-label="Sections"></nav>
    </aside>
    <main>
      <section class="page-section" id="top-observers">
        <h2>Top Observers</h2>
        <div class="segmented" id="observer-metric" role="group" aria-label="Rank observers by">
          <button type="button" data-metric="observations" aria-pressed="true">Observations</button>
          <button type="button" data-metric="species" aria-pressed="false">Species</button>
        </div>
        <ol class="observers" id="observers"></ol>
      </section>
      <section class="page-section" id="recent-observations">
        <h2>Recent Observations</h2>
        <div class="carousel" id="carousel">
          <button class="arrow" id="prev" aria-label="Newer observations" disabled>&#8249;</button>
          <div class="mosaic" id="grid" role="region" aria-label="Activity"></div>
          <button class="arrow" id="next" aria-label="Older observations" disabled>&#8250;</button>
        </div>
      </section>
      <section class="page-section" id="trends">
        <h2>Trends</h2>
        <div class="segmented" id="trend-metric" role="group" aria-label="Show trend of">
          <button type="button" data-metric="observations" aria-pressed="true">Observations</button>
          <button type="button" data-metric="species" aria-pressed="false">Species</button>
          <button type="button" data-metric="observers" aria-pressed="false">Observers</button>
        </div>
        <div id="trend-body">
          <figure class="trend-chart" id="trend-chart">
            <div class="trend-tooltip" id="trend-tooltip" hidden></div>
          </figure>
          <p class="trend-note"><span id="trend-status" aria-live="polite"></span> Running totals at the end of each year, verifiable observations only.</p>
          <details class="trend-data">
            <summary>Show data table</summary>
            <table id="trend-table"></table>
          </details>
        </div>
      </section>
    </main>
  </div>
  <script src="js/spaces.js"></script>
  <script>
    // Look up the space from ?id=…, expose its settings to the page scripts, then load them in order
    const SPACE = (window.SPACES || []).find((spc) => spc.id === new URLSearchParams(location.search).get("id"));
    const SPACE_NAME = SPACE?.title;
    const SPACE_SUBTITLE = SPACE?.subtitle;
    const PLACE_ID = SPACE?.place_id;

    if (!SPACE) {
      document.title = "Open space not found";
      const msg = document.createElement("p");
      msg.className = "empty";
      msg.append("That open space wasn't found. ");
      const link = document.createElement("a");
      link.href = "index.html";
      link.textContent = "See all open spaces";
      msg.appendChild(link);
      document.querySelector("main").replaceChildren(msg);
      document.getElementById("space-title").textContent = "Not found";
    } else {
      [
        "js/queries.js",
        "js/top_observers.js",
        "js/site_viz.js",
        "spaces/" + SPACE.id + "/trends_cache.js", // optional; a missing cache just means more live requests
        "js/trends.js",
        "js/sections.js",
      ].forEach((src) => {
        const script = document.createElement("script");
        script.src = src;
        script.async = false; // run in the order listed
        document.body.appendChild(script);
      });
    }
  </script>
</body>
</html>
