<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Space Corridors</title>
  <meta name="description" content="Colorado open spaces.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="landing" id="landing">
    <header>
      <h1>Open Space Corridors</h1>
    </header>
    <div class="landing-body" id="landing-body">
      <div class="space-map" id="space-map" role="region" aria-label="Map of open spaces"></div>
      <aside class="space-panel" id="space-panel">
        <div class="panel-tabs" id="panel-tabs" role="tablist" aria-label="Map views"></div>
        <div class="panel-content" id="panel-content" role="tabpanel" aria-live="polite">
          <p class="panel-hint">Hover over an open space to see its signature species.</p>
        </div>
      </aside>
    </div>
    <section class="grid" id="grid" aria-label="Open spaces"></section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/spaces.js"></script>
  <script src="js/boundaries.js"></script>
  <script src="js/featured_species.js"></script>
  <script src="js/names.js"></script>
  <script src="js/species_network.js"></script>
  <script src="js/network.js"></script>
  <script src="js/help_tasks.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
