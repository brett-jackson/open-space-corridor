<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Space Corridors</title>
  <meta name="description" content="Colorado open spaces.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="landing" id="landing">
    <header>
      <h1>Open Space Corridors</h1>
    </header>
    <div class="landing-body" id="landing-body">
      <div class="space-map" id="space-map" role="region" aria-label="Map of open spaces"></div>
      <aside class="space-panel" id="space-panel" aria-live="polite">
        <p class="panel-hint">Hover over an open space to see its signature species.</p>
      </aside>
    </div>
    <section class="grid" id="grid" aria-label="Open spaces"></section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/spaces.js"></script>
  <script src="js/boundaries.js"></script>
  <script src="js/featured_species.js"></script>
  <script src="js/names.js"></script>
  <script>
    const grid = document.getElementById("grid");
    const map_el = document.getElementById("space-map");
    const panel = document.getElementById("space-panel");
    const spaces = window.SPACES || [];
    const located = spaces.filter((spc) => Array.isArray(spc.location));

    function spaceHref(spc) {
      return "space.html?id=" + encodeURIComponent(spc.id);
    }

    // The original card; used as the fallback list when the map can't be shown
    function makeCard(spc) {
      const a = document.createElement("a");
      a.className = "space";
      a.href = spaceHref(spc);

      if (spc.image) {
        const img = document.createElement("img");
        img.src = spc.image;
        img.alt = "";
        img.loading = "lazy";
        a.appendChild(img);
      } else {
        const ph = document.createElement("div");
        ph.className = "placeholder";
        a.appendChild(ph);
      }

      const body = document.createElement("div");
      body.className = "space-body";
      const h2 = document.createElement("h2");
      h2.textContent = spc.title;
      body.appendChild(h2);
      if (spc.description) {
        const p = document.createElement("p");
        p.textContent = spc.description;
        body.appendChild(p);
      }
      a.appendChild(body);
      return a;
    }

    // Small photo marker that grows into a card on hover or keyboard focus
    function makeMarker(spc) {
      const a = document.createElement("a");
      a.className = "map-card";
      a.href = spaceHref(spc);
      a.setAttribute("aria-label", spc.title);

      if (spc.image) {
        const img = document.createElement("img");
        img.src = spc.image;
        img.alt = "";
        a.appendChild(img);
      } else {
        const ph = document.createElement("div");
        ph.className = "placeholder";
        a.appendChild(ph);
      }

      const body = document.createElement("div");
      body.className = "map-card-body";
      const h2 = document.createElement("h2");
      h2.textContent = spc.title;
      body.appendChild(h2);
      if (spc.description) {
        const p = document.createElement("p");
        p.textContent = spc.description;
        body.appendChild(p);
      }
      a.appendChild(body);

      const wrap = document.createElement("div");
      wrap.appendChild(a);
      return wrap;
    }

    // Without the map, fall back to the plain page layout with no side panel
    function useListLayout() {
      document.getElementById("landing-body").remove();
      document.getElementById("landing").classList.remove("landing");
    }

    // Side panel: the hovered space's signature species, its most distinctive by TF-IDF (js/featured_species.js)
    const featured = window.FEATURED_SPECIES || { by_space: {} };
    let panel_space = null;

    function showPanel(spc) {
      if (panel_space === spc.id) return;
      panel_space = spc.id;

      const title = document.createElement("h2");
      title.className = "panel-title";
      const link = document.createElement("a");
      link.href = spaceHref(spc);
      link.textContent = spc.title;
      title.appendChild(link);
      const parts = [title];
      if (spc.subtitle) {
        const sub = document.createElement("p");
        sub.className = "panel-subtitle";
        sub.textContent = spc.subtitle;
        parts.push(sub);
      }

      const heading = document.createElement("h3");
      heading.className = "panel-heading";
      heading.textContent = "Signature Species";
      parts.push(heading);

      const list = featured.by_space[spc.id] || [];
      if (list.length === 0) {
        const none = document.createElement("p");
        none.className = "panel-hint";
        none.textContent = "Not enough observations here yet.";
        parts.push(none);
      } else {
        const lede = document.createElement("p");
        lede.className = "panel-lede";
        lede.textContent = "Species seen here more than at other spaces.";
        parts.push(lede);
        const ol = document.createElement("ol");
        ol.className = "featured-species";
        list.forEach((sp) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = "https://www.inaturalist.org/taxa/" + sp.taxon_id;
          a.target = "_blank";
          a.rel = "noopener";

          if (sp.photo) {
            const img = document.createElement("img");
            img.src = sp.photo;
            img.alt = "";
            img.loading = "lazy";
            img.title = sp.attribution; // iNaturalist photo credit
            a.appendChild(img);
          } else {
            const ph = document.createElement("span");
            ph.className = "placeholder";
            a.appendChild(ph);
          }

          const text = document.createElement("span");
          text.className = "featured-text";
          const common = document.createElement("span");
          common.className = "featured-common";
          common.textContent = sp.common_name ? formatCommonName(sp.common_name) : sp.name;
          if (!sp.common_name) common.classList.add("scientific");
          text.appendChild(common);
          if (sp.common_name) {
            const sci = document.createElement("span");
            sci.className = "featured-sci";
            sci.textContent = sp.name;
            text.appendChild(sci);
          }
          const meta = document.createElement("span");
          meta.className = "featured-meta";
          const where = sp.spaces === 1 ? "only here" : `in ${sp.spaces} of ${featured.spaces_compared} spaces`;
          meta.textContent = `${sp.count.toLocaleString()} ${sp.count === 1 ? "observation" : "observations"} · ${where}`;
          text.appendChild(meta);
          a.appendChild(text);

          li.appendChild(a);
          ol.appendChild(li);
        });
        parts.push(ol);
        const note = document.createElement("p");
        note.className = "panel-note";
        note.textContent = "Ranked by TF-IDF, which weighs how often a species is observed here against how many of the other spaces it appears in. Species introduced to Colorado are left out. Photos from iNaturalist; hover a photo for its credit.";
        parts.push(note);
      }
      panel.replaceChildren(...parts);
      panel.scrollTop = 0;
    }

    if (spaces.length === 0) {
      const msg = document.createElement("p");
      msg.className = "empty";
      msg.innerHTML = "No spaces found.";
      grid.replaceWith(msg);
      useListLayout();
    } else if (typeof L === "undefined" || located.length === 0) {
      // No map library (e.g. offline) or no coordinates: show the plain card grid, north to south
      useListLayout();
      [...spaces].sort((a, b) => (b.location?.[0] ?? 0) - (a.location?.[0] ?? 0))
        .forEach((spc) => grid.appendChild(makeCard(spc)));
    } else {
      grid.remove();
      // Scroll to zoom toward the pointer; quarter-level steps keep it smooth
      const map = L.map(map_el, { scrollWheelZoom: true, zoomSnap: 0.25, wheelPxPerZoomLevel: 90 });
      // Esri hybrid: World Imagery satellite photos with transparent road and place-name overlays.
      // Esri-style tile services, so the URLs are z/y/x
      const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
      L.tileLayer(ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 18,
        attribution: 'Imagery &copy; <a href="https://www.esri.com/">Esri</a>, Maxar, Earthstar Geographics, and the GIS User Community',
      }).addTo(map);
      L.tileLayer(ESRI + "Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", { maxZoom: 18 }).addTo(map);
      L.tileLayer(ESRI + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 18,
        attribution: 'Labels &copy; Esri',
      }).addTo(map);

      const EXPANDED_CARD = { w: 260, h: 250 }; // matches .map-card:hover in styles.css

      // Boundary outlines from js/boundaries.js (optional; built by scripts/update_boundaries.py)
      const boundaries = window.SPACE_BOUNDARIES || {};
      const frame = L.latLngBounds(located.map((spc) => spc.location));

      located.forEach((spc) => {
        let outline = null;
        if (boundaries[spc.id]) {
          outline = L.geoJSON(boundaries[spc.id], { style: { className: "space-boundary" }, interactive: true }).addTo(map);
          outline.on("click", () => { location.href = spaceHref(spc); });
          frame.extend(outline.getBounds());
        }

        const marker_html = makeMarker(spc);
        L.marker(spc.location, {
          icon: L.divIcon({ className: "map-marker", html: marker_html, iconSize: [64, 64], iconAnchor: [32, 64] }),
          riseOnHover: true,
          keyboard: false, // the link inside the marker is the focus target
        }).addTo(map);

        // Before a card expands, keep it inside the map: slide it sideways off the edges,
        // and grow it downward from the thumbnail when there isn't room above the pin
        const card = marker_html.firstChild;
        const placeCard = () => {
          const pt = map.latLngToContainerPoint(spc.location);
          const half = EXPANDED_CARD.w / 2 + 8;
          const shift = Math.max(half - pt.x, Math.min(0, map_el.clientWidth - half - pt.x));
          card.style.setProperty("--shift-x", shift + "px");
          marker_html.classList.toggle("down", pt.y < EXPANDED_CARD.h + 16);
        };
        card.addEventListener("pointerenter", placeCard);
        card.addEventListener("focus", placeCard);
        // The side panel keeps the last space shown, so the pointer can travel over to it
        card.addEventListener("pointerenter", () => showPanel(spc));
        card.addEventListener("focus", () => showPanel(spc));

        // Hovering or focusing either the marker or the outline highlights the outline
        if (outline) {
          const setActive = (on) => outline.eachLayer((layer) => layer.getElement()?.classList.toggle("active", on));
          card.addEventListener("pointerenter", () => setActive(true));
          card.addEventListener("pointerleave", () => setActive(false));
          card.addEventListener("focus", () => setActive(true));
          card.addEventListener("blur", () => setActive(false));
          outline.on("mouseover", () => { setActive(true); showPanel(spc); });
          outline.on("mouseout", () => setActive(false));
        }
      });

      // Frame every space and its boundary, with room for the markers to expand
      const fit = () => map.fitBounds(frame, {
        paddingTopLeft: [50, 90], // room for the resting markers, which sit above their pins
        paddingBottomRight: [50, 30],
        maxZoom: 16,
      });
      fit();
      window.addEventListener("resize", fit);
    }
  </script>
</body>
</html>
